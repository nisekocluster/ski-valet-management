<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#09131f">
<title>Ski Valet · Self check-in</title>
<link rel="manifest" href="/kiosk.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/kiosk-icon-192.png">
<link rel="apple-touch-icon" href="/kiosk-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ski Valet Kiosk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Ski Valet — guest kiosk (self pre-check-in on a touch screen, landscape).
   The guest enters room, name and how many items; the valet confirms it at
   the counter. The page is drawn at 1280×800 (landscape) or 900×1300 (portrait) and scaled to fill the screen.
   ========================================================================== */
:root{
  --night:#09131f; --slab:#132333; --slab2:#1a3042; --line:#2b4357;
  --frost:#f1f7fc; --mist:#a8bdcf; --dim:#71899e;
  --signal:#FF6A2B; --signal-d:#E2551A; --glacier:#5EC8F2; --ok:#35C36A; --bad:#FF4D4D;
  --r:22px; --r-s:14px;
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden}
body{background:var(--night); color:var(--frost); font-family:var(--body); overflow:hidden;
  user-select:none; -webkit-user-select:none; touch-action:manipulation; overscroll-behavior:none}
input{user-select:text; -webkit-user-select:text}
[hidden]{display:none !important}
.kiosk{width:1280px; height:800px; position:fixed; left:0; top:0; transform-origin:0 0; overflow:hidden;
  background:radial-gradient(1200px 700px at 85% -10%, #173a55 0%, transparent 60%), var(--night)}

.top{position:absolute; top:0; left:0; right:0; height:96px; display:flex; align-items:center; padding:0 40px; gap:24px}
.brand{font-family:var(--display); font-weight:700; font-size:34px; letter-spacing:.5px; display:flex; align-items:center; gap:12px}
.brand i{width:14px; height:14px; border-radius:4px; background:var(--signal); display:inline-block}
.pill.fs{width:56px; padding:0; display:grid; place-items:center; color:var(--glacier)}
.pill.fs svg{width:28px; height:28px}
.steps{flex:1; max-width:420px; margin:0 auto; height:6px; border-radius:3px; background:var(--line); overflow:hidden; visibility:hidden}
.steps.on{visibility:visible}
.steps i{display:block; height:100%; width:0; background:var(--signal); border-radius:3px; transition:width .25s}
.pill{height:56px; padding:0 24px; border-radius:999px; border:1px solid var(--line); background:var(--slab);
  color:var(--frost); font:600 20px var(--body); cursor:pointer}
.screen{position:absolute; inset:96px 0 0 0; padding:20px 64px 40px; display:none; flex-direction:column}
.screen.on{display:flex; animation:in .25s ease}
@keyframes in{from{opacity:.2; transform:translateX(24px)} to{opacity:1; transform:none}}
h1{font-family:var(--display); font-weight:700; font-size:64px; line-height:1; margin:0 0 10px; letter-spacing:.3px}
.sub{font-size:24px; color:var(--mist); margin:0; line-height:1.4}
.body{flex:1; display:flex; gap:48px; align-items:center; min-height:0}
.foot{display:flex; justify-content:space-between; align-items:center; gap:20px}
.btn{height:88px; min-width:220px; padding:0 40px; border-radius:var(--r); border:0; cursor:pointer;
  font:700 28px var(--body); display:inline-flex; align-items:center; justify-content:center; gap:12px; color:var(--frost)}
.btn.go{background:var(--signal); color:#fff; box-shadow:0 10px 30px rgba(255,106,43,.35)}
.btn.go:active{background:var(--signal-d)}
.btn.go:disabled{background:var(--slab2); color:var(--dim); box-shadow:none; cursor:default}
.btn.ghost{background:transparent; border:2px solid var(--line); color:var(--mist)}
.btn:active{transform:scale(.98)}
.warn{color:#ffb38f; font-size:20px; min-height:28px; text-align:center; flex:1}

/* welcome */
.welcome{justify-content:center; align-items:center; text-align:center}
.welcome h1{font-size:96px}
.welcome .sub{font-size:28px; margin-bottom:56px}
.langs{display:grid; grid-template-columns:repeat(4, 240px); gap:20px}
.lang{height:150px; border-radius:var(--r); background:var(--slab); border:2px solid var(--line); color:var(--frost);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px}
.lang b{font-size:36px; font-weight:700}
.lang span{font-size:18px; color:var(--mist)}
.lang:active{border-color:var(--signal); background:#24170f}
.tapnote{margin-top:48px; font-size:22px; color:var(--dim)}

/* number pad (room number, pairing code) */
.display{width:440px; height:150px; border-radius:var(--r); background:var(--slab); border:2px solid var(--line);
  font:700 96px var(--display); letter-spacing:6px; display:flex; align-items:center; justify-content:center}
.display.empty{color:var(--dim); font-size:40px; letter-spacing:0; font-family:var(--body); font-weight:500}
.pad{display:grid; grid-template-columns:repeat(3, 132px); gap:14px}
.pad button{height:96px; border-radius:var(--r-s); border:0; background:var(--slab2); color:var(--frost);
  font:600 40px var(--body); cursor:pointer}
.pad button:active{background:var(--line)}
.pad .fn{font-size:22px; color:var(--mist)}

/* name */
.fields{display:flex; flex-direction:column; gap:28px; width:780px}
.names{display:flex; gap:20px}
.names .field{flex:1}
.names.family-first .last{order:-1}   /* ja / zh / ko: family name first */
.field span{display:block; font-size:22px; color:var(--mist); margin-bottom:10px}
.field input{width:100%; height:96px; border-radius:var(--r); border:2px solid var(--line); background:var(--slab);
  color:var(--frost); font:600 40px var(--body); padding:0 28px; outline:none; color-scheme:dark}
.field input:focus{border-color:var(--glacier)}
.field small{display:block; font-size:18px; color:var(--dim); margin-top:8px}
/* hotel check-out date: our own calendar icon, and the whole box opens the picker (some tablets show no icon) */
.field .datebox{position:relative; display:block; margin:0; font-size:inherit; color:inherit}
.datebox input{padding-right:100px; cursor:pointer}
.datebox input::-webkit-calendar-picker-indicator{position:absolute; inset:0; width:auto; height:auto; opacity:0; cursor:pointer}
.datebox input::-webkit-inner-spin-button, .datebox input::-webkit-clear-button{display:none}
.datebox svg{position:absolute; right:26px; top:50%; width:48px; height:48px; transform:translateY(-50%); color:var(--glacier); pointer-events:none}
.datebox em{position:absolute; left:30px; top:50%; transform:translateY(-50%); font:500 32px var(--body); font-style:normal;
  color:var(--dim); pointer-events:none; display:none; background:var(--slab); padding-right:12px}
.datebox.empty em{display:block}
.datebox.empty input{color:transparent}
.datebox.empty input::-webkit-datetime-edit{opacity:0}
.kb-note{width:300px; color:var(--dim); font-size:20px; line-height:1.5; border:2px dashed var(--line); border-radius:var(--r);
  padding:28px; align-self:center}

/* equipment */
.eq{display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; width:100%}
.card{background:var(--slab); border:2px solid var(--line); border-radius:var(--r); padding:28px; display:flex;
  flex-direction:column; align-items:center; gap:18px; transition:border-color .15s}
.card.has{border-color:var(--glacier)}
.card svg{width:96px; height:96px; color:var(--glacier)}
.card b{font-size:30px}
.card .unit{font-size:18px; color:var(--mist); margin-top:-12px}
.count{display:flex; align-items:center; gap:20px}
.count button{width:84px; height:84px; border-radius:50%; border:2px solid var(--line); background:var(--slab2);
  color:var(--frost); font:500 44px var(--body); cursor:pointer; line-height:1}
.count button.plus{background:var(--signal); border-color:var(--signal); color:#fff}
.count button:disabled{opacity:.35}
.count output{font:700 72px var(--display); width:72px; text-align:center}

/* identification photo */
.cam{width:440px; height:440px; border-radius:50%; background:#0b1a28; border:4px solid var(--line); position:relative;
  overflow:hidden; flex:none; display:grid; place-items:center}
.cam.shot{border-color:var(--ok)}
.cam > svg{width:62%; color:#29445c}
.cam video, .cam img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none}
.cam video{transform:scaleX(-1)}             /* a mirror is what people expect to see */
.cam.live video, .cam.shot img{display:block}
.cam .oval{position:absolute; inset:36px 70px; border:3px dashed rgba(94,200,242,.6); border-radius:50%; pointer-events:none}
.cam.shot .oval{display:none}
.cam .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.cam .flash.go{animation:flash .35s ease}
@keyframes flash{0%{opacity:.9} 100%{opacity:0}}
.photo-side{display:flex; flex-direction:column; gap:24px; max-width:560px}
.consent{display:flex; gap:18px; align-items:flex-start; font-size:22px; line-height:1.45; cursor:pointer; text-align:left;
  background:var(--slab); border:2px solid var(--line); border-radius:var(--r); padding:22px; color:var(--frost); font-family:var(--body)}
.consent.on{border-color:var(--glacier)}
.box{width:44px; height:44px; flex:none; border-radius:10px; border:3px solid var(--mist); display:grid; place-items:center}
.consent.on .box{background:var(--glacier); border-color:var(--glacier)}
.box svg{width:28px; display:none; color:var(--night)}
.consent.on .box svg{display:block}
.privacy{font-size:18px; color:var(--dim); line-height:1.5}

/* review */
.sum{width:100%; display:grid; grid-template-columns:1fr 1fr; gap:18px; max-height:100%; overflow-y:auto; align-content:start;
  touch-action:pan-y; overscroll-behavior:contain}
.sum .it.person b{font-size:28px}
.sum .it.person em{display:block; font-style:normal; font-size:20px; color:var(--frost); margin-top:4px}
.sum .it .ini{width:76px; height:76px; flex:none; border-radius:50%; background:var(--slab2); display:grid; place-items:center;
  font:700 30px var(--display); color:var(--glacier)}
.sum .it{background:var(--slab); border:2px solid var(--line); border-radius:var(--r); padding:22px 26px; display:flex;
  align-items:center; gap:20px; min-height:120px}
.sum .it div{flex:1}
.sum .it span{display:block; font-size:18px; color:var(--mist); margin-bottom:6px}
.sum .it b{font-size:32px}
.sum .face{width:76px; height:76px; flex:none !important; border-radius:50%; border:3px solid var(--ok); object-fit:cover}
.sum .it .edit{height:56px; padding:0 22px; border-radius:999px; border:2px solid var(--line); background:transparent;
  color:var(--glacier); font:600 20px var(--body); cursor:pointer}

/* done */
.done{justify-content:center; align-items:center; text-align:center; cursor:pointer}
.tick{width:150px; height:150px; border-radius:50%; background:var(--ok); display:grid; place-items:center; margin-bottom:28px}
.tick svg{width:84px; color:#fff}
.bigroom{font:700 120px var(--display); color:var(--signal); line-height:1; margin:20px 0}
.done .sub{max-width:900px}
.reset{margin-top:40px; color:var(--dim); font-size:22px}
.done .group{color:var(--glacier); margin-top:14px; min-height:34px}
/* people of the room */
.card.grp{width:360px; flex:none; padding:36px 28px}
.card.grp .count output{font-size:96px; width:110px}
.card.grp .unit{font-size:22px; margin-top:0}
[data-s="group"] .fields{flex:1; width:auto}

/* idle warning */
.idle{position:absolute; inset:0; background:rgba(5,11,18,.82); display:none; place-items:center; z-index:5}
.idle.on{display:grid}
.idle .dlg{width:620px; background:var(--slab); border:2px solid var(--line); border-radius:28px; padding:48px; text-align:center}
.idle h2{font:700 52px var(--display); margin:0 0 12px}
.idle .sub{margin-bottom:36px}

/* portrait screens (stand-up kiosks): stack what sits side by side in landscape */
.portrait .screen{padding:24px 56px 48px}
.portrait .body{flex-direction:column; justify-content:center; gap:40px}
.portrait .fields{width:100%}
.portrait [data-s="2"] .body{justify-content:flex-start; padding-top:48px}   /* stay above the screen keyboard */
.portrait .card.grp{width:100%; display:flex; flex-direction:row; justify-content:center; gap:36px}
.portrait [data-s="group"] .fields{width:100%; flex:none}
.portrait .card.grp .unit{align-self:center}
.portrait .kb-note{display:none}
.portrait .langs{grid-template-columns:repeat(2, 330px); gap:24px}
.portrait .lang{height:180px}
.portrait .eq{grid-template-columns:1fr; gap:24px}
.portrait .card{display:grid; grid-template-columns:96px 1fr auto; column-gap:30px; row-gap:2px; align-items:center;
  justify-items:start; padding:26px 34px}
.portrait .card svg{grid-row:1 / 3}
.portrait .card b{align-self:end}
.portrait .card .unit{grid-column:2; margin:0; align-self:start}
.portrait .card .count{grid-column:3; grid-row:1 / 3}
.portrait .photo-side{max-width:none; width:100%}
.portrait .sum{grid-template-columns:1fr}
.portrait .done .sub{max-width:760px}
</style>
</head>
<body>
<div class="kiosk" id="kiosk">

  <div class="top">
    <div class="brand"><i></i>Ski Valet</div>
    <div class="steps" id="steps"><i id="bar"></i></div>
    <button class="pill fs" id="fsBtn" hidden aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="pill" id="restart" data-t="startover" style="visibility:hidden"></button>
  </div>

  <!-- setup: pair this screen (staff only, English) -->
  <section class="screen" data-s="setup">
    <h1>Set up this screen</h1>
    <p class="sub">Enter the 6-digit code from the admin console (Kiosks → Add screen or New code).</p>
    <div class="body" style="justify-content:center">
      <div class="display empty" id="codeDisp"></div>
      <div class="pad" data-pad="code"></div>
    </div>
    <div class="foot"><button class="btn ghost" id="installBtn" hidden>Install as app</button><span class="warn" id="codeWarn"></span><button class="btn go" id="pairBtn">Pair screen</button></div>
  </section>

  <!-- 0 · welcome / language -->
  <section class="screen welcome" data-s="0">
    <h1 data-t="welcome"></h1>
    <p class="sub" data-t="welcome_sub"></p>
    <div class="langs">
      <button class="lang" data-lang="en"><b>English</b><span>Start</span></button>
      <button class="lang" data-lang="ja"><b>日本語</b><span>はじめる</span></button>
      <button class="lang" data-lang="zh"><b>中文</b><span>开始</span></button>
      <button class="lang" data-lang="ko"><b>한국어</b><span>시작</span></button>
    </div>
    <div class="tapnote">Ski · Snowboard · Boots</div>
  </section>

  <!-- 1 · room number -->
  <section class="screen" data-s="1">
    <h1 data-t="room_t"></h1>
    <p class="sub" data-t="room_h"></p>
    <div class="body" style="justify-content:center">
      <div class="display empty" id="roomDisp"></div>
      <div class="pad" data-pad="room"></div>
    </div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button><span class="warn" id="roomWarn"></span><button class="btn go" data-go="1" id="roomNext" data-t="next"></button></div>
  </section>

  <!-- group · how many people of the room leave equipment + the hotel check-out date -->
  <section class="screen" data-s="group">
    <h1 data-t="grp_t"></h1>
    <p class="sub" id="grpSub"></p>
    <div class="body">
      <div class="card grp">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="20" r="9"/><path d="M8 54c0-10 7-17 16-17s16 7 16 17"/><circle cx="44" cy="22" r="7"/><path d="M42 37c8 0 14 6 14 15"/></svg>
        <div class="count"><button data-ppl="-1">−</button><output id="pplN">1</output><button class="plus" data-ppl="1">+</button></div>
        <div class="unit" id="pplU"></div>
      </div>
      <div class="fields">
        <label class="field"><span data-t="checkout"></span><span class="datebox empty" id="depBox"><input id="dep" type="date"><em data-t="dep_pick"></em><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><rect x="7" y="13" width="3" height="3" rx=".5" fill="currentColor" stroke="none"/></svg></span><small data-t="dep_h"></small></label>
      </div>
    </div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button><button class="btn go" data-go="1" id="grpNext" data-t="next"></button></div>
  </section>

  <!-- 2 · name (one person) -->
  <section class="screen" data-s="2">
    <h1 id="nameTitle"></h1>
    <p class="sub" data-t="name_h"></p>
    <div class="body">
      <div class="fields">
        <div class="names" id="names">
          <label class="field"><span data-t="firstname"></span><input id="first" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
          <label class="field last"><span data-t="lastname"></span><input id="last" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="60"></label>
        </div>
      </div>
      <div class="kb-note" data-t="kb_note"></div>
    </div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button><button class="btn go" data-go="1" id="nameNext" data-t="next"></button></div>
  </section>

  <!-- 3 · equipment -->
  <section class="screen" data-s="3">
    <h1 id="eqTitle"></h1>
    <p class="sub" data-t="eq_h"></p>
    <div class="body"><div class="eq" id="eq"></div></div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button>
      <span class="warn" id="eqWarn"></span>
      <button class="btn go" data-go="1" id="eqNext" data-t="next"></button></div>
  </section>

  <!-- 4 · identification photo (optional, with consent) -->
  <section class="screen" data-s="4">
    <h1 id="phTitle"></h1>
    <p class="sub" data-t="ph_h"></p>
    <div class="body" style="justify-content:center">
      <div class="cam" id="cam">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.5" r="4.5"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg>
        <video id="video" playsinline muted></video><img id="faceImg" alt="">
        <div class="oval"></div><div class="flash" id="flash"></div>
      </div>
      <div class="photo-side">
        <button class="consent" id="consent"><div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M4 12.5l5 5L20 6.5"/></svg></div><div data-t="consent"></div></button>
        <button class="btn go" id="shoot" style="width:100%"></button>
        <div class="privacy" id="privacy"></div>
      </div>
    </div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button><button class="btn ghost" data-go="1" id="photoNext"></button></div>
  </section>

  <!-- 5 · review + send -->
  <section class="screen" data-s="5">
    <h1 data-t="rv_t"></h1>
    <p class="sub" id="rvSub"></p>
    <div class="body"><div class="sum" id="sum"></div></div>
    <div class="foot"><button class="btn ghost" data-go="-1" data-t="back"></button>
      <span class="warn" id="sendWarn"></span>
      <button class="btn go" id="send" style="min-width:320px"></button></div>
  </section>

  <!-- 6 · done -->
  <section class="screen done" data-s="6">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <h1 data-t="done_t"></h1>
    <div class="bigroom" id="doneRoom"></div>
    <p class="sub" data-t="done_h"></p>
    <p class="sub group" id="doneCount"></p>
    <div class="reset" id="reset"></div>
  </section>

  <div class="idle" id="idle"><div class="dlg">
    <h2 data-t="idle_t"></h2>
    <p class="sub" id="idleSub"></p>
    <button class="btn go" id="stay" data-t="idle_b" style="width:100%"></button>
  </div></div>

</div>

<script>
"use strict";
const T = {
  en:{welcome:"Welcome", welcome_sub:"Ski & snowboard storage — self check-in. Choose your language to begin.",
    room_t:"What is your room number?", room_h:"You'll find it on your room key.", room_bad:"Room {n} does not exist. Check the number on your room key.", clear:"Clear",
    name_t:"Your name", name_h:"As on your hotel reservation, in English letters.", firstname:"First name", lastname:"Last name",
    checkout:"Hotel check-out date", dep_h:"The day you leave the hotel", dep_pick:"Tap to choose", kb_note:"The screen keyboard opens when you tap a name box.",
    eq_t:"What are you leaving with us?", eq_h:"Tap + for each item. We store boots, skis (with poles) and snowboards.",
    boots:"Boots", boots_u:"pairs", skis:"Skis + poles", skis_u:"sets", snowboards:"Snowboard", snowboards_u:"boards", need:"Add at least one item.",
    ph_t:"A photo for your security", ph_h:"Staff will check it when you pick up your equipment. This step is optional.",

const ITEMS = ["boots", "skis", "snowboards"];
const FAMILY_FIRST = ["ja", "zh", "ko"];
const MAX_PEOPLE = 8, IDLE_AFTER = 60, IDLE_GRACE = 15, DONE_RESET = 5;
/* one entry per person of the room who leaves equipment: each is sent as their own pre-check-in,
   so the valet knows whose each item is at pick-up */
const person = () => ({first:"", last:"", eq:{boots:0, skis:0, snowboards:0}, consent:false, face:null, sent:false});
const blank = () => ({lang:"en", pos:0, room:"", dep:"", people:[person()], camErr:false, sending:false, err:"", ret:false});
let S = blank(), paired = false, code = "", pairing = false;
/* the hotel's rooms (floors and room range), sent by the server; null = not known yet, the server still checks */
let ROOMS = null;
const roomExists = num => { if(!ROOMS) return true;
  if(!/^[1-9]\d{2,3}$/.test(num)) return false;
  const n = +num, floor = Math.floor(n / 100), k = n % 100;
  return ROOMS.floors.includes(floor) && k >= ROOMS.from && k <= ROOMS.to; };

/* the screens in order: language, room, people + check-out date, then name → equipment → photo
   for each person, review, done. S.pos is the place in this list. */
const seq = () => [{s:"0"}, {s:"1"}, {s:"group"},
  ...S.people.flatMap((_, p) => [{s:"2", p}, {s:"3", p}, {s:"4", p}]), {s:"5"}, {s:"6"}];
const at = () => seq()[S.pos] || {s:"0"};
const step = () => at().s;
const pi = () => at().p ?? 0;
const P = () => S.people[pi()] || S.people[0];
const posOf = (st, p) => seq().findIndex(x => x.s === st && (p == null || x.p === p));
const many = () => S.people.length > 1;

const $ = q => document.querySelector(q);
const t = (k, n, m) => (T[S.lang][k] ?? T.en[k]).replace("{n}", n).replace("{m}", m);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nameOk = (x = P()) => !!(x.first.trim() && x.last.trim());
const isoDay = (n=0) => { const d=new Date(); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const depOk = () => !!S.dep && S.dep >= isoDay(0) && S.dep <= isoDay(180);   // the hotel check-out date is required
const fullName = (x = P()) => (FAMILY_FIRST.includes(S.lang) ? [x.last, x.first] : [x.first, x.last]).map(v => v.trim()).join(" ");
const total = (x = P()) => ITEMS.reduce((n, k) => n + x.eq[k], 0);
const complete = x => nameOk(x) && total(x) > 0;
const eqText = x => ITEMS.filter(k => x.eq[k]).map(k => `${x.eq[k]} × ${t(k)}`).join(" · ");

async function api(path, body){
  const opts = {method: body ? "POST" : "GET", credentials: "same-origin", cache: "no-store", headers: {}};
  if(body){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let r;
  try{ r = await fetch(path, opts); }
  catch(_){ const e = new Error("offline"); e.offline = true; throw e; }
  let data = null; try{ data = await r.json(); }catch(_){}
  if(!r.ok){ const e = new Error((data && data.error) || "Server error " + r.status); e.status = r.status; throw e; }
  return data;
}

/* web app: Chrome / Edge offer to install the kiosk (desktop shortcut, opens full screen without the address bar) */
let installPrompt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; $("#installBtn").hidden = false; });
addEventListener("appinstalled", () => { installPrompt = null; $("#installBtn").hidden = true; });
async function installApp(){
  if(!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => null);
  installPrompt = null; $("#installBtn").hidden = true;
}

const depShown = () => $("#depBox").classList.toggle("empty", !$("#dep").value);

/* fit the layout to whatever screen this is: 1280×800 in landscape, 900×1300 in portrait, scaled up or down,
   and the drawing area grows to the screen's shape so a big 16:9 or 9:16 screen is filled edge to edge */
function fit(){
  const de = document.documentElement;
  const W = de.clientWidth || innerWidth, H = de.clientHeight || innerHeight, portrait = H > W * 1.1;
  const bw = portrait ? 900 : 1280, bh = portrait ? 1300 : 800;
  const s = Math.min(W / bw, H / bh), k = $("#kiosk");
  k.classList.toggle("portrait", portrait);
  k.style.width = W / s + "px"; k.style.height = H / s + "px";
  k.style.transform = `scale(${s})`;           // pinned to the top-left corner and exactly the window's size
  if(scrollX || scrollY) scrollTo(0, 0);       // a focused box must never leave the page shifted
}
const refit = () => requestAnimationFrame(fit);   // after full screen / window changes the size settles a frame later
addEventListener("resize", refit);
addEventListener("scroll", () => { if(scrollX || scrollY) scrollTo(0, 0); });
document.addEventListener("fullscreenchange", refit);
document.addEventListener("webkitfullscreenchange", refit);
if(window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);

function pad(kind, label){
  return [1,2,3,4,5,6,7,8,9].map(n => `<button data-${kind}="${n}">${n}</button>`).join("")
    + `<button class="fn" data-${kind}="c">${label}</button><button data-${kind}="0">0</button><button class="fn" data-${kind}="b">⌫</button>`;
}

  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  const st = paired ? step() : "setup", x = P(), n = S.people.length, list = seq();
  document.querySelectorAll(".screen").forEach(el => el.classList.toggle("on", el.dataset.s === st));
  const mid = paired && st !== "0" && st !== "6";
  $("#restart").style.visibility = mid ? "visible" : "hidden";
  $("#steps").classList.toggle("on", mid);
  $("#bar").style.width = mid ? Math.round(100 * (S.pos - 1) / (list.length - 3)) + "%" : "0";
  // setup
  $("#codeDisp").textContent = code || "— — — — — —";
  $("#codeDisp").classList.toggle("empty", !code);
  $('[data-pad="code"]').innerHTML = pad("code", "Clear");
  $("#pairBtn").disabled = code.length !== 6 || pairing;
  // room
  $("#roomDisp").textContent = S.room || "— — — —";
  $("#roomDisp").classList.toggle("empty", !S.room);
  $('[data-pad="room"]').innerHTML = pad("room", t("clear"));
  $("#roomNext").disabled = S.room.length < 3;
  $("#roomWarn").textContent = step() === "1" ? S.err : "";
  // people + check-out date
  $("#grpSub").textContent = t("grp_h", S.room);
  $("#pplN").textContent = n;
  $("#pplU").textContent = t(n === 1 ? "ppl_1" : "ppl_n");
  $('[data-ppl="-1"]').disabled = n <= 1 || S.people.some(y => y.sent);
  $('[data-ppl="1"]').disabled = n >= MAX_PEOPLE;
  $("#dep").min = isoDay(0); $("#dep").max = isoDay(180);
  $("#grpNext").disabled = !depOk();
  // name
  $("#nameTitle").textContent = many() ? t("person_t", pi() + 1, n) : t("name_t");
  $("#names").classList.toggle("family-first", FAMILY_FIRST.includes(S.lang));
  $("#nameNext").disabled = !nameOk();
  // equipment
  $("#eqTitle").textContent = many() ? t("eq_tp", x.first.trim()) : t("eq_t");
  $("#eq").innerHTML = ITEMS.map(k => `<div class="card ${x.eq[k] ? "has" : ""}">
      ${ICON[k]}<b>${t(k)}</b><div class="unit">${t(k + "_u")}</div>
      <div class="count"><button data-eq="${k}" data-d="-1" ${x.eq[k] ? "" : "disabled"}>−</button>
      <output>${x.eq[k]}</output><button class="plus" data-eq="${k}" data-d="1" ${x.eq[k] >= 9 ? "disabled" : ""}>+</button></div></div>`).join("");
  $("#eqNext").disabled = !total();
  $("#eqWarn").textContent = total() ? "" : t("need");

  $("#phTitle").textContent = many() ? t("ph_tp", x.first.trim()) : t("ph_t");
  $("#cam").classList.toggle("live", !!stream && !x.face);
  $("#cam").classList.toggle("shot", !!x.face);
  $("#faceImg").src = x.face || "";
  $("#consent").classList.toggle("on", x.consent);
  $("#shoot").textContent = S.camErr ? t("cam_off") : !x.consent ? t("need_ok") : x.face ? t("retake") : t("take");
  $("#shoot").disabled = S.camErr || !x.consent || (!x.face && !stream);
  $("#shoot").className = "btn " + (x.face ? "ghost" : "go");
  $("#privacy").textContent = t("privacy");
  $("#photoNext").textContent = x.face ? t("next") : t("skip");
  $("#photoNext").className = "btn " + (x.face ? "go" : "ghost");
  // review: the room, then one card per person with their own equipment
  const locked = S.people.some(y => y.sent), left = S.people.filter(y => !y.sent).length;
  const edit = attr => locked ? "" : `<button class="edit" ${attr}>${t("edit")}</button>`;
  $("#rvSub").textContent = many() ? t("rv_hg") : t("rv_h");
  $("#sum").innerHTML = `<div class="it"><div><span>${t("room")}</span><b>${esc(S.room)}</b></div>${edit('data-edit="1"')}</div>
    <div class="it"><div><span>${t("leave")}</span><b>${S.dep ? esc(new Date(S.dep + "T00:00").toLocaleDateString(S.lang, {month:"short", day:"numeric"})) : ""}</b></div>${edit('data-edit="group"')}</div>`
    + S.people.map((y, i) => `<div class="it person">${y.face ? `<img class="face" src="${y.face}" alt="">` : `<div class="ini">${esc((y.first.trim()[0] || "?").toUpperCase())}</div>`}
      <div><span>${t("name")}${y.face ? " · " + t("photo_ok") : ""}</span><b>${esc(fullName(y))}${y.sent ? " ✓" : ""}</b><em>${esc(eqText(y))}</em></div>
      ${y.sent ? "" : `<button class="edit" data-editp="${i}">${t("edit")}</button>`}</div>`).join("");
  $("#send").textContent = S.sending ? t("sending") : many() ? t("send_all", left) : t("send");
  $("#send").disabled = S.sending;
  $("#sendWarn").textContent = S.err;
  // done
  $("#doneRoom").textContent = S.room;
  $("#doneCount").textContent = n > 1 ? t("done_count", n) : "";
}

function go(pos){
  S.pos = Math.max(0, Math.min(seq().length - 1, pos));
  S.err = "";
  const st = step(), x = P();
  if(st === "4") startCam(); else stopCam();
  if(st === "2"){
    // a family: the next person usually shares the last name
    if(!x.last && pi() > 0) x.last = S.people[pi() - 1].last;
    $("#first").value = x.first; $("#last").value = x.last;
  }
  render();
  if(st === "2") setTimeout(() => $(FAMILY_FIRST.includes(S.lang) ? "#last" : "#first").focus(), 50);
  if(st === "6") doneCountdown();
}
/* Next. When the guest came from the review to change something, they go back to it as soon as
   that part is done (a person added meanwhile is entered first). */
function next(){
  const list = seq(), cur = list[S.pos], nx = list[S.pos + 1];
  if(cur.s === "1" && !roomExists(S.room)){ S.err = t("room_bad", S.room); render(); return; }
  if(S.ret && !(cur.p != null && nx && nx.p === cur.p)){
    const i = S.people.findIndex(y => !complete(y));
    if(i >= 0 && cur.p !== i) return go(posOf("2", i));
    S.ret = false;
    return go(posOf("5"));
  }
  go(S.pos + 1);
}
function back(){
  const st = step();
  if(S.ret && (st === "1" || st === "group" || st === "2")){ S.ret = false; return go(posOf("5")); }
  go(S.pos - 1);
}
function resetAll(){
  clearInterval(doneTimer);
  if(document.activeElement) document.activeElement.blur();
  stopCam();
  S = blank();
  $("#first").value = ""; $("#last").value = ""; $("#dep").value = ""; depShown();
  hideIdle(); go(0);
}

/* camera: front camera, live only while the guest has agreed and is on the photo step */
let stream = null;
async function startCam(){
  if(stream || P().face || !P().consent || S.camErr) return;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera");
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:{ideal:960}, height:{ideal:960}}, audio:false});
    if(step() !== "4" || !P().consent || P().face){ st.getTracks().forEach(x => x.stop()); return; }   // the guest moved on meanwhile
    stream = st;
    const v = $("#video"); v.srcObject = stream; await v.play();
  }catch(_){ S.camErr = true; stopCam(); }
  render();
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(x => x.stop()); stream = null; }
  const v = $("#video"); if(v) v.srcObject = null;
}
function shoot(){
  const v = $("#video");
  if(!stream || !v.videoWidth) return;
  const n = Math.min(v.videoWidth, v.videoHeight), c = document.createElement("canvas");
  c.width = c.height = 480;                          // a square crop is plenty to recognise a face
  c.getContext("2d").drawImage(v, (v.videoWidth - n) / 2, (v.videoHeight - n) / 2, n, n, 0, 0, 480, 480);
  P().face = c.toDataURL("image/jpeg", 0.8);
  const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  stopCam(); render();
}

async function send(){
  if(S.sending) return;
  S.sending = true; S.err = ""; render();
  try{
    for(const y of S.people){
      if(y.sent) continue;
      const r = await api("/api/kiosk/precheck", {room_number:S.room, first_name:y.first, last_name:y.last,
        departure:S.dep || null, lang:S.lang, ...y.eq,
        ...(y.face && y.consent ? {face_photo:y.face, consent:true} : {})});
      S.room = r.room_number; y.sent = true;
    }
    S.sending = false; go(posOf("6"));
  }catch(e){
    S.sending = false;
    if(e.status === 401){ paired = false; resetAll(); return; }      // the admin removed this screen
    const msg = e.offline ? t("err_net") : e.status === 429 ? t("busy") : e.status === 400 ? e.message : t("err");
    const sent = S.people.filter(y => y.sent).length;
    S.err = sent ? t("sent_part", sent) + " " + msg : msg;
    render();
  }
}

async function pair(){
  if(code.length !== 6 || pairing) return;
  pairing = true; $("#codeWarn").textContent = ""; render();
  try{ await api("/api/kiosk/pair", {code}); paired = true; code = ""; resetAll();
    api("/api/kiosk/me").then(m => { ROOMS = m.hotel_rooms || null; }).catch(() => {}); }
  catch(e){ $("#codeWarn").textContent = e.offline ? "No connection to the server" : e.message; code = ""; }
  finally{ pairing = false; render(); }
}

let doneTimer;
function doneCountdown(){
  clearInterval(doneTimer);
  let n = DONE_RESET;
  $("#reset").textContent = t("reset", n);
  doneTimer = setInterval(() => { n--; $("#reset").textContent = t("reset", n); if(n <= 0) resetAll(); }, 1000);
}

/* inactivity: warn after IDLE_AFTER s, reset IDLE_GRACE s later — nothing stays on screen for the next guest */
let idleAt = Date.now(), idleTimer = null;
const poke = () => { idleAt = Date.now(); };
function hideIdle(){ $("#idle").classList.remove("on"); clearInterval(idleTimer); idleTimer = null; poke(); }
function showIdle(){
  let n = IDLE_GRACE;
  if(document.activeElement) document.activeElement.blur();
  $("#idle").classList.add("on"); $("#idleSub").textContent = t("idle_s", n);
  idleTimer = setInterval(() => { n--; $("#idleSub").textContent = t("idle_s", n); if(n <= 0) resetAll(); }, 1000);
}
setInterval(() => {
  if(!paired || step() === "0" || step() === "6" || idleTimer || S.sending) return;
  if(Date.now() - idleAt > IDLE_AFTER * 1000) showIdle();
}, 1000);

/* full screen hides the browser bar. A page may only ask for it on a tap, and it is lost
   when the page reloads, so every tap re-enters it if needed: the pairing taps the first
   time, then the next guest's first tap after a restart. (Locking the device to this page
   is done on the device: Guided Access, screen pinning or a kiosk browser.) */
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const canFull = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
let fsAsking = false;
function goFullscreen(){
  const el = document.documentElement;
  if(isFull() || fsAsking || !canFull()) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req) return;
  fsAsking = true;                               // one request per tap: a second one in the same tap is refused
  const done = () => { fsAsking = false; fsShown(); };
  setTimeout(() => { fsAsking = false; }, 1500);   // never stay stuck if the browser does not answer
  try{
    const r = req.call(el, {navigationUI:"hide"});
    if(r && r.then) r.then(done, err => { console.warn("Full screen refused:", err && err.message); done(); });
    else setTimeout(done, 500);
  }catch(err){ console.warn("Full screen refused:", err && err.message); done(); }
}
/* the corner button shows while the screen is not full screen, in case a tap was not enough */
const fsShown = () => { $("#fsBtn").hidden = isFull() || !canFull(); };
/* touch screens: pointerup / touchend count as a tap even when the finger moved a little and no click follows */
addEventListener("pointerup", e => { if(e.pointerType !== "mouse") goFullscreen(); }, true);
addEventListener("touchend", goFullscreen, true);
addEventListener("click", goFullscreen, true);
addEventListener("keydown", goFullscreen, true);
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, fsShown));
document.addEventListener("pointerdown", poke);
document.addEventListener("keydown", poke);
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("click", e => {
  if(paired && step() === "6"){ resetAll(); return; }     // the next guest need not wait
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.lang){ S.lang = d.lang; go(1); }
  else if(d.go) (+d.go > 0 ? next() : back());
  else if(d.edit){ S.ret = true; go(posOf(d.edit)); }
  else if(d.editp){ S.ret = true; go(posOf("2", +d.editp)); }
  else if(d.ppl){ const n = Math.max(1, Math.min(MAX_PEOPLE, S.people.length + +d.ppl));
    while(S.people.length < n) S.people.push(person());
    S.people.length = n; render(); }
  else if(d.room){ S.room = d.room === "c" ? "" : d.room === "b" ? S.room.slice(0, -1) : (S.room + d.room).slice(0, 4); S.err = ""; render(); }
  else if(d.code){ code = d.code === "c" ? "" : d.code === "b" ? code.slice(0, -1) : (code + d.code).slice(0, 6); render(); }
  else if(d.eq){ const x = P(); x.eq[d.eq] = Math.max(0, Math.min(9, x.eq[d.eq] + +d.d)); render(); }
  else if(b.id === "send") send();
  else if(b.id === "consent"){ const x = P(); x.consent = !x.consent; if(!x.consent){ x.face = null; stopCam(); render(); } else { render(); startCam(); } }
  else if(b.id === "shoot"){ const x = P(); if(x.face){ x.face = null; render(); startCam(); } else shoot(); }
  else if(b.id === "pairBtn") pair();
  else if(b.id === "installBtn") installApp();
  else if(b.id === "fsBtn") goFullscreen();
  else if(b.id === "restart") resetAll();
  else if(b.id === "stay") hideIdle();
});
["first", "last"].forEach(k => $("#" + k).addEventListener("input", e => { P()[k] = e.target.value; $("#nameNext").disabled = !nameOk(); }));
["input", "change"].forEach(ev => $("#dep").addEventListener(ev, e => { S.dep = e.target.value; depShown(); $("#grpNext").disabled = !depOk(); }));
$("#dep").addEventListener("click", e => { try{ e.target.showPicker(); }catch(_){} });   // the whole box opens the calendar
$("#first").addEventListener("keydown", e => { if(e.key === "Enter") $(FAMILY_FIRST.includes(S.lang) ? "#first" : "#last").focus(); });
$("#last").addEventListener("keydown", e => { if(e.key === "Enter" && nameOk()) next(); });

(async () => {
  fit(); render(); fsShown();
  try{ const me = await api("/api/kiosk/me"); paired = !!me.kiosk; ROOMS = me.hotel_rooms || null; }
  catch(e){ paired = !!e.offline; }      // offline at start: keep working, sending tells if it is still paired
  resetAll();
})();
</script>
</body>
</html>
